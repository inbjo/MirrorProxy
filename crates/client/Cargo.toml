[package]
name = "mirrorproxy-cli"
version = "1.7.3"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mirrorproxy"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mirrorproxy-catalog = { path = "../catalog" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
toml_edit = "0.23"
url = "2"
