name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Install Chromium for browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: web
        run: npm run test:e2e
      - name: Rust format
        run: cargo fmt --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Real server and administration smoke
        run: |
          cargo build --locked -p mirrorproxy-server
          ./scripts/smoke-admin-api.sh target/debug/mirrorproxy-server

  supply-chain:
    name: Supply chain and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 affects RSA private-key operations. MirrorProxy only
          # reaches rsa through openidconnect for public-key signature verification,
          # and the advisory currently has no patched rsa release.
          ignore: RUSTSEC-2023-0071
      - name: Audit web dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: Generate Rust coverage
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: lcov.info

  client-native:
    name: Client tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n scripts/install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run native client tests
        run: cargo test --locked -p mirrorproxy-cli
      - name: Validate distribution scripts and Debian client package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shellcheck \
            scripts/package-client-deb.sh \
            scripts/generate-apt-repository.sh \
            scripts/generate-package-manifests.sh
          cargo build --locked -p mirrorproxy-cli
          ./scripts/package-client-deb.sh target/debug/mirrorproxy 1.3.1 amd64 dist-test
          test "$(dpkg-deb -f dist-test/mirrorproxy_1.3.1_amd64.deb Package)" = mirrorproxy
          test "$(dpkg-deb -f dist-test/mirrorproxy_1.3.1_amd64.deb Architecture)" = amd64
          dpkg-deb -c dist-test/mirrorproxy_1.3.1_amd64.deb | grep -q './usr/bin/mirrorproxy$'

  client-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install JavaScript package clients
        run: npm install --global pnpm@10 yarn@1.22.22
      - uses: actions/setup-go@v6
        with:
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - uses: cachix/install-nix-action@v31
      - name: Install repository clients
        run: sudo apt-get update && sudo apt-get install -y cabal-install cpanminus luarocks maven r-base
      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Run public client protocol smoke
        env:
          MIRRORPROXY_SMOKE_DOCKER: "1"
          MIRRORPROXY_SMOKE_EXTENDED: "1"
          MIRRORPROXY_SMOKE_NATIVE_EXTENDED: "1"
        run: ./scripts/smoke-clients.sh
