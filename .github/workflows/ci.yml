name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Windows PowerShell 5.1 installer contract
        shell: powershell
        run: ./scripts/test-install-windows-powershell.ps1
      - name: PowerShell 7 installer contract
        shell: pwsh
        run: ./scripts/test-install-windows-powershell.ps1
  frontend:
    name: Frontend tests, build and browser checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        id: node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies and run frontend tests
        working-directory: web
        run: |
          npm ci
          npm test
          npm run test:toolchain
      - uses: ./.github/actions/build-web
        with:
          node-version: ${{ steps.node.outputs.node-version }}
      - uses: actions/upload-artifact@v6
        with:
          name: ci-web-console
          path: |
            web/dist
            target/frontend-artifact.json
          retention-days: 1
          if-no-files-found: error
      - name: Verify release download tables
        run: |
          python3 scripts/test-release-body.py
          python3 scripts/test-package-manifests.py
          python3 scripts/test-docker-manifest.py
          python3 scripts/test-frontend-build-manifest.py
      - name: Verify local build cache invalidation
        run: node --test scripts/build-cache.test.mjs
      - name: PowerShell installer offline contract
        shell: pwsh
        run: ./scripts/test-install-powershell.ps1
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium for browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        working-directory: web
        run: npm run test:e2e

  checks:
    needs: frontend
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require all frontend checks to pass
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$FRONTEND_RESULT" = success
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3, Node 24
        with:
          prefix-key: mirrorproxy-rust-v1
          shared-key: ${{ runner.os }}-${{ runner.arch }}-checks
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OPENSSL PKG_CONFIG AR
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser smoke dependencies
        working-directory: web
        run: npm ci
      - uses: ./.github/actions/download-web
        with:
          name: ci-web-console
      - name: Rust format
        run: cargo fmt --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Controlled download public artifact smoke
        run: cargo test --locked -p mirrorproxy-server public_artifact_download_checks_payload_quota_stats_and_domain_block -- --ignored --nocapture
      - name: Real server and administration smoke
        run: |
          cargo build --locked -p mirrorproxy-server
          ./scripts/smoke-admin-api.sh target/debug/mirrorproxy-server
          python3 scripts/smoke-source-details.py target/debug/mirrorproxy-server
          node web/scripts/smoke-admin-browser.mjs target/debug/mirrorproxy-server
          node web/scripts/smoke-passkey-browser.mjs target/debug/mirrorproxy-server

  supply-chain:
    needs: frontend
    name: Supply chain and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3, Node 24
        with:
          prefix-key: mirrorproxy-rust-v1
          shared-key: ${{ runner.os }}-${{ runner.arch }}-coverage
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OPENSSL PKG_CONFIG AR
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null || [[ "$(cargo audit --version | awk '{print $NF}')" != '0.22.2' ]]; then
            cargo install cargo-audit --locked --version 0.22.2
          fi
      - name: Audit Rust dependencies
        # Only the reviewed OIDC public-key verification paths are excepted:
        # RSA private-key timing (2023-0071) and crypto-bigint secret-integer
        # timing (2026-0387). Neither path handles private keys in MirrorProxy.
        # See SECURITY.md; all other vulnerabilities still fail this gate.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387
      - name: Audit web dependencies
        working-directory: web
        run: |
          npm ci
          node scripts/audit-dependencies.mjs
      - uses: ./.github/actions/download-web
        with:
          name: ci-web-console
      - name: Generate Rust coverage
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v6
        with:
          name: rust-coverage
          path: lcov.info

  client-native:
    name: Client tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3, Node 24
        with:
          prefix-key: mirrorproxy-rust-v1
          shared-key: ${{ runner.os }}-${{ runner.arch }}-client-tests
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OPENSSL PKG_CONFIG AR
      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: bash
        run: sh -n scripts/install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run native client tests
        if: matrix.os != 'windows-11-arm'
        run: cargo test --locked -p mirrorproxy-cli
      - name: Run Windows ARM64 client tests
        if: matrix.os == 'windows-11-arm'
        run: cargo test --locked -p mirrorproxy-cli --target aarch64-pc-windows-msvc
      - name: Validate distribution scripts and Linux client packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shellcheck \
            scripts/package-client-deb.sh \
            scripts/package-client-rpm.sh \
            scripts/generate-apt-repository.sh \
            scripts/generate-package-manifests.sh
          cargo build --locked -p mirrorproxy-cli
          ./scripts/package-client-deb.sh target/debug/mirrorproxy 1.3.1 amd64 dist-test
          test "$(dpkg-deb -f dist-test/mirrorproxy_1.3.1_amd64.deb Package)" = mirrorproxy
          test "$(dpkg-deb -f dist-test/mirrorproxy_1.3.1_amd64.deb Architecture)" = amd64
          dpkg-deb -c dist-test/mirrorproxy_1.3.1_amd64.deb | grep -q './usr/bin/mirrorproxy$'
          sudo apt-get update
          sudo apt-get install --yes rpm cpio
          python3 scripts/test-client-packages.py target/debug/mirrorproxy

  windows-server:
    needs: frontend
    name: Windows server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/strawberry-perl-5.42.3.1-portable.zip
          key: windows-perl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-windows-build.ps1') }}
      - name: Prepare Windows OpenSSL build tools
        run: ./scripts/setup-windows-build.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3, Node 24
        with:
          prefix-key: mirrorproxy-rust-v1
          shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-server-tests
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OPENSSL PKG_CONFIG AR
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/download-web
        with:
          name: ci-web-console
      - name: Build Windows server
        run: cargo build --locked -p mirrorproxy-server --target ${{ matrix.target }}
      - name: Verify Windows server protocol
        run: python scripts/smoke-source-details.py target/${{ matrix.target }}/debug/mirrorproxy-server.exe

  client-smoke:
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3, Node 24
        with:
          prefix-key: mirrorproxy-rust-v1
          shared-key: ${{ runner.os }}-${{ runner.arch }}-client-smoke
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OPENSSL PKG_CONFIG AR
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install JavaScript package clients
        run: npm install --global pnpm@10 yarn@1.22.22
      - uses: actions/setup-go@v6
        with:
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - uses: cachix/install-nix-action@v31
      - name: Install repository clients
        run: sudo apt-get update && sudo apt-get install -y cabal-install cpanminus luarocks maven r-base
      - uses: ./.github/actions/download-web
        with:
          name: ci-web-console
      - name: Run public client protocol smoke
        env:
          MIRRORPROXY_SMOKE_DOCKER: "1"
          MIRRORPROXY_SMOKE_OCI_PUBLIC: "1"
          MIRRORPROXY_SMOKE_EXTENDED: "1"
          MIRRORPROXY_SMOKE_NATIVE_EXTENDED: "1"
        run: ./scripts/smoke-clients.sh
