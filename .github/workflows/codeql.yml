name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust analysis toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Configure Rust extractor paths
        if: matrix.language == 'rust'
        shell: bash
        run: |
          task_rust_sysroot="$(rustc --print sysroot)"
          task_rust_src="${task_rust_sysroot}/lib/rustlib/src/rust/library"
          task_proc_macro_server="${task_rust_sysroot}/libexec/rust-analyzer-proc-macro-srv"
          test -d "${task_rust_src}"
          test -x "${task_proc_macro_server}"
          {
            echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT=${task_rust_sysroot}"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT_SRC=${task_rust_src}"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_PROC_MACRO_SERVER=${task_proc_macro_server}"
          } >> "${GITHUB_ENV}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
