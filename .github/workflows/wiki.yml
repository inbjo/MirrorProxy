name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirrorproxy-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish canonical Wiki pages
        env:
          # The Actions GitHub App token cannot access the repository's
          # separate .wiki.git remote. WIKI_TOKEN must be a repository-scoped
          # PAT with Contents read/write access.
          GH_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=WIKI_TOKEN is required::Create a fine-grained PAT for this repository with Contents read/write, save it as the WIKI_TOKEN Actions secret, then rerun this workflow."
            exit 1
          fi
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git clone "$wiki_url" wiki-repository; then
            echo "::error title=Wiki clone failed::Verify that WIKI_TOKEN belongs to an account with write access to this repository and has Contents read/write permission."
            exit 1
          fi
          find wiki-repository -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki-repository/
          git -C wiki-repository config user.name github-actions[bot]
          git -C wiki-repository config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C wiki-repository add .
          git -C wiki-repository diff --cached --quiet && exit 0
          git -C wiki-repository commit -m "docs: sync project wiki"
          git -C wiki-repository push origin HEAD:master
